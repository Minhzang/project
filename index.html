<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trình Quản Lý Chi Tiêu Cá Nhân</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { color-scheme: light dark; }
    html, body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    /* Improve number input appearance */
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex items-center justify-between gap-4">
        <h1 class="text-xl sm:text-2xl font-semibold tracking-tight">Trình Quản Lý Chi Tiêu Cá Nhân</h1>
        <div class="flex items-center gap-2">
          <button id="btnExport" class="px-3 py-2 text-sm font-medium rounded-md bg-slate-900 text-white hover:bg-slate-800">Xuất dữ liệu</button>
          <label class="px-3 py-2 text-sm font-medium rounded-md border border-slate-300 bg-white text-slate-700 cursor-pointer hover:bg-slate-50">
            Nhập dữ liệu
            <input id="fileImport" type="file" accept="application/json" class="hidden" />
          </label>
          <button id="btnClearAll" class="px-3 py-2 text-sm font-medium rounded-md border border-rose-200 text-rose-700 bg-rose-50 hover:bg-rose-100">Xóa tất cả</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left: Form + Filters -->
      <section class="lg:col-span-1 space-y-6">
        <!-- Add Expense Card -->
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm">
          <div class="p-5 border-b border-slate-200">
            <h2 class="text-base font-semibold">Thêm khoản chi</h2>
          </div>
          <form id="expenseForm" class="p-5 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="date" class="block text-sm font-medium text-slate-700">Ngày</label>
                <input id="date" name="date" type="date" required class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
              <div>
                <label for="amount" class="block text-sm font-medium text-slate-700">Số tiền (VND)</label>
                <input id="amount" name="amount" type="number" min="0" step="1000" placeholder="vd. 100000" required class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="category" class="block text-sm font-medium text-slate-700">Danh mục</label>
                <select id="category" name="category" class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500">
                  <option>Ăn uống</option>
                  <option>Di chuyển</option>
                  <option>Hóa đơn</option>
                  <option>Mua sắm</option>
                  <option>Sức khỏe</option>
                  <option>Giải trí</option>
                  <option>Giáo dục</option>
                  <option>Khác</option>
                </select>
              </div>
              <div>
                <label for="note" class="block text-sm font-medium text-slate-700">Ghi chú</label>
                <input id="note" name="note" type="text" placeholder="vd. Cà phê sáng" class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
            </div>
            <div class="pt-2">
              <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-md bg-slate-900 text-white font-medium hover:bg-slate-800">
                Thêm khoản chi
              </button>
            </div>
          </form>
        </div>

        <!-- Filters Card -->
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm">
          <div class="p-5 border-b border-slate-200">
            <h2 class="text-base font-semibold">Bộ lọc</h2>
          </div>
          <div class="p-5 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="filterCategory" class="block text-sm font-medium text-slate-700">Danh mục</label>
                <select id="filterCategory" class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500">
                  <option value="">Tất cả</option>
                  <option>Ăn uống</option>
                  <option>Di chuyển</option>
                  <option>Hóa đơn</option>
                  <option>Mua sắm</option>
                  <option>Sức khỏe</option>
                  <option>Giải trí</option>
                  <option>Giáo dục</option>
                  <option>Khác</option>
                </select>
              </div>
              <div>
                <label for="filterSearch" class="block text-sm font-medium text-slate-700">Tìm kiếm</label>
                <input id="filterSearch" type="text" placeholder="Ghi chú..." class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="filterFrom" class="block text-sm font-medium text-slate-700">Từ ngày</label>
                <input id="filterFrom" type="date" class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
              <div>
                <label for="filterTo" class="block text-sm font-medium text-slate-700">Đến ngày</label>
                <input id="filterTo" type="date" class="mt-1 block w-full rounded-md border-slate-300 focus:border-slate-500 focus:ring-slate-500" />
              </div>
            </div>
            <div class="pt-2 flex items-center gap-2">
              <button id="btnResetFilters" class="px-3 py-2 text-sm font-medium rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">Đặt lại</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Summary + List -->
      <section class="lg:col-span-2 space-y-6">
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <div class="text-sm text-slate-500">Tổng chi</div>
            <div id="summaryTotal" class="mt-1 text-2xl font-semibold">0 ₫</div>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <div class="text-sm text-slate-500">Số khoản</div>
            <div id="summaryCount" class="mt-1 text-2xl font-semibold">0</div>
          </div>
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <div class="text-sm text-slate-500">Khoản trung bình</div>
            <div id="summaryAvg" class="mt-1 text-2xl font-semibold">0 ₫</div>
          </div>
        </div>

        <!-- Chart -->
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="flex items-center justify-between gap-2 mb-4">
            <h2 class="text-base font-semibold">Biểu đồ theo danh mục</h2>
            <div class="text-sm text-slate-500">Dựa trên dữ liệu đang lọc</div>
          </div>
          <div class="relative h-64">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>

        <!-- List -->
        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex items-center justify-between">
            <h2 class="text-base font-semibold">Danh sách khoản chi</h2>
            <div class="text-sm text-slate-500" id="listInfo">0 mục</div>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
              <thead class="bg-slate-50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600">Ngày</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600">Danh mục</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600">Ghi chú</th>
                  <th class="px-4 py-3 text-right text-xs font-semibold text-slate-600">Số tiền</th>
                  <th class="px-4 py-3"></th>
                </tr>
              </thead>
              <tbody id="expenseTbody" class="divide-y divide-slate-200"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Constants
    const LOCAL_STORAGE_KEY = 'vn.personal.expense.tracker.v1';
    const DEFAULT_CATEGORIES = [
      'Ăn uống', 'Di chuyển', 'Hóa đơn', 'Mua sắm', 'Sức khỏe', 'Giải trí', 'Giáo dục', 'Khác'
    ];

    // State
    let expenses = [];
    let categoryChart = null;

    // Utilities
    function generateId() {
      const randomPart = Math.random().toString(36).slice(2, 10);
      return `${Date.now()}_${randomPart}`;
    }

    function parseAmountToNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function formatCurrencyVND(amount) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(amount);
    }

    function readExpensesFromStorage() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter(Boolean)
          .map(item => ({
            id: String(item.id ?? generateId()),
            date: String(item.date ?? new Date().toISOString().slice(0, 10)),
            category: String(item.category ?? 'Khác'),
            note: String(item.note ?? ''),
            amount: parseAmountToNumber(item.amount ?? 0)
          }));
      } catch (e) {
        console.error('Không thể đọc dữ liệu:', e);
        return [];
      }
    }

    function saveExpensesToStorage(items) {
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        console.error('Không thể lưu dữ liệu:', e);
      }
    }

    function addExpense(expense) {
      expenses.push(expense);
      expenses.sort((a, b) => b.date.localeCompare(a.date));
      saveExpensesToStorage(expenses);
    }

    function deleteExpenseById(id) {
      expenses = expenses.filter(item => item.id !== id);
      saveExpensesToStorage(expenses);
    }

    function clearAllExpenses() {
      expenses = [];
      saveExpensesToStorage(expenses);
    }

    function getFilters() {
      const category = document.getElementById('filterCategory').value.trim();
      const search = document.getElementById('filterSearch').value.trim().toLowerCase();
      const from = document.getElementById('filterFrom').value;
      const to = document.getElementById('filterTo').value;
      return { category, search, from, to };
    }

    function filterExpenses(source) {
      const { category, search, from, to } = getFilters();
      return source.filter(item => {
        if (category && item.category !== category) return false;
        if (search && !(`${item.note}`.toLowerCase().includes(search))) return false;
        if (from && item.date < from) return false;
        if (to && item.date > to) return false;
        return true;
      });
    }

    function updateSummary(filtered) {
      const total = filtered.reduce((sum, it) => sum + it.amount, 0);
      const count = filtered.length;
      const avg = count ? Math.round(total / count) : 0;
      document.getElementById('summaryTotal').textContent = formatCurrencyVND(total);
      document.getElementById('summaryCount').textContent = String(count);
      document.getElementById('summaryAvg').textContent = formatCurrencyVND(avg);
    }

    function renderList(filtered) {
      const tbody = document.getElementById('expenseTbody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="5" class="px-4 py-6 text-center text-slate-500">Không có dữ liệu</td>`;
        tbody.appendChild(tr);
      } else {
        for (const item of filtered) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="px-4 py-3 text-sm text-slate-700">${item.date}</td>
            <td class="px-4 py-3 text-sm text-slate-700">${item.category}</td>
            <td class="px-4 py-3 text-sm text-slate-700">${item.note || ''}</td>
            <td class="px-4 py-3 text-sm text-slate-900 text-right font-medium">${formatCurrencyVND(item.amount)}</td>
            <td class="px-4 py-3 text-right">
              <button data-id="${item.id}" class="btn-delete px-3 py-1.5 text-sm rounded-md border border-slate-300 text-slate-700 hover:bg-slate-50">Xóa</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }

      document.getElementById('listInfo').textContent = `${filtered.length} mục`;

      tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          if (!id) return;
          const ok = confirm('Xác nhận xóa khoản chi này?');
          if (!ok) return;
          deleteExpenseById(id);
          performRender();
        });
      });
    }

    function buildCategoryDataset(filtered) {
      const totalsByCategory = new Map();
      for (const cat of DEFAULT_CATEGORIES) totalsByCategory.set(cat, 0);
      for (const item of filtered) {
        const current = totalsByCategory.get(item.category) ?? 0;
        totalsByCategory.set(item.category, current + item.amount);
      }
      const labels = [];
      const data = [];
      for (const [label, value] of totalsByCategory.entries()) {
        labels.push(label);
        data.push(value);
      }
      return { labels, data };
    }

    function ensureChartInstance() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (categoryChart) return categoryChart;
      categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            label: 'Tổng chi',
            data: [],
            backgroundColor: [
              '#0ea5e9', '#22c55e', '#f97316', '#e11d48', '#8b5cf6', '#14b8a6', '#f59e0b', '#64748b'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatCurrencyVND(ctx.parsed)}` } }
          }
        }
      });
      return categoryChart;
    }

    function updateChart(filtered) {
      const chart = ensureChartInstance();
      const { labels, data } = buildCategoryDataset(filtered);
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.update();
    }

    function performRender() {
      const filtered = filterExpenses(expenses);
      updateSummary(filtered);
      renderList(filtered);
      updateChart(filtered);
    }

    function resetFilters() {
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterSearch').value = '';
      document.getElementById('filterFrom').value = '';
      document.getElementById('filterTo').value = '';
    }

    function exportData() {
      const dataStr = JSON.stringify(expenses, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const date = new Date().toISOString().slice(0, 10);
      a.download = `chi-tieu-${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importDataFromFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(String(e.target?.result ?? '[]'));
          if (!Array.isArray(parsed)) throw new Error('Dữ liệu không hợp lệ');
          const sanitized = parsed.map(item => ({
            id: String(item.id ?? generateId()),
            date: String(item.date ?? new Date().toISOString().slice(0, 10)),
            category: String(item.category ?? 'Khác'),
            note: String(item.note ?? ''),
            amount: parseAmountToNumber(item.amount ?? 0)
          }));
          expenses = sanitized.sort((a, b) => b.date.localeCompare(a.date));
          saveExpensesToStorage(expenses);
          performRender();
          alert('Nhập dữ liệu thành công');
        } catch (err) {
          console.error(err);
          alert('Không thể nhập dữ liệu: ' + err.message);
        }
      };
      reader.onerror = () => alert('Không thể đọc tệp.');
      reader.readAsText(file);
    }

    // Event wiring
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize state
      expenses = readExpensesFromStorage();

      // Default date is today
      const inputDate = document.getElementById('date');
      inputDate.value = new Date().toISOString().slice(0, 10);

      // Form submission
      const form = document.getElementById('expenseForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const date = String(formData.get('date') || '').slice(0, 10);
        const amount = parseAmountToNumber(formData.get('amount'));
        const category = String(formData.get('category') || 'Khác');
        const note = String(formData.get('note') || '').trim();

        if (!date) {
          alert('Vui lòng chọn ngày.');
          return;
        }
        if (!(amount > 0)) {
          alert('Số tiền phải lớn hơn 0.');
          return;
        }

        const newExpense = { id: generateId(), date, amount, category, note };
        addExpense(newExpense);

        form.reset();
        document.getElementById('date').value = date; // keep date

        performRender();
      });

      // Filters
      document.getElementById('filterCategory').addEventListener('change', performRender);
      document.getElementById('filterSearch').addEventListener('input', performRender);
      document.getElementById('filterFrom').addEventListener('change', performRender);
      document.getElementById('filterTo').addEventListener('change', performRender);
      document.getElementById('btnResetFilters').addEventListener('click', () => { resetFilters(); performRender(); });

      // Clear all
      document.getElementById('btnClearAll').addEventListener('click', () => {
        if (expenses.length === 0) return;
        const ok = confirm('Xóa tất cả dữ liệu? Hành động không thể hoàn tác.');
        if (!ok) return;
        clearAllExpenses();
        performRender();
      });

      // Export/Import
      document.getElementById('btnExport').addEventListener('click', exportData);
      document.getElementById('fileImport').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) importDataFromFile(file);
        e.target.value = '';
      });

      // First render
      performRender();
    });
  </script>
</body>
</html>
